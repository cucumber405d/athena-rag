apiVersion: v1
kind: Secret
metadata:
  name: {{ include "athena.fullname" . }}
  labels:
    {{- include "athena.labels" . | nindent 4 }}
type: Opaque
data:
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | b64enc }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | b64enc }}
  LMSTUDIO_API_KEY: {{ .Values.secrets.lmstudioApiKey | b64enc }}
  VLLM_API_KEY: {{ .Values.secrets.vllmApiKey | b64enc }}
