apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "athena.fullname" . }}-qdrant
  labels:
    {{- include "athena.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: {{ include "athena.fullname" . }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      {{- include "athena.labels" . | nindent 6 }}
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        {{- include "athena.labels" . | nindent 8 }}
        app.kubernetes.io/component: qdrant
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - name: http
              containerPort: {{ .Values.qdrant.httpPort }}
            - name: grpc
              containerPort: {{ .Values.qdrant.grpcPort }}
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.qdrant.httpPort }}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.qdrant.httpPort }}
            initialDelaySeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.qdrant.storageSize }}
