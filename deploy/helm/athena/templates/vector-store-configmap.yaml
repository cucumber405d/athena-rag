apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "athena.fullname" . }}-vector-store-config
  labels:
    {{- include "athena.labels" . | nindent 4 }}
data:
  # Overrides the image's built-in configs/vector_stores.yaml (mounted over it via subPath) —
  # the qdrant.url baked into the image points at localhost, which doesn't exist in-cluster;
  # QdrantVectorStoreAdapter is built straight from this file, no env var reads it.
  vector_stores.yaml: |
    vector_store:
      backend: qdrant

      qdrant:
        url: http://{{ include "athena.fullname" . }}-qdrant:{{ .Values.qdrant.httpPort }}
        api_key_env: QDRANT_API_KEY
        default_collection: athena_chunks_bge_m3_v1

      chroma:
        persist_dir: ./data/chroma
        default_collection: athena_dev_chunks_v1
