[project]
name = "athena"
version = "0.1.0"
description = "Local-first scalable RAG platform with hybrid search, configurable vector stores and Gradio UIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "chromadb>=0.5",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "pillow>=10.3",
    "gradio>=4.36",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "charset-normalizer>=3.3",
    "ftfy>=6.2",
    "py3langid>=0.3",
    "matplotlib>=3.8",
    "semantic-text-splitter>=0.32",
    "pytesseract>=0.3.10",
    "pypdfium2>=5.0",
]

[project.optional-dependencies]
# Experimental, parallel LlamaIndex-based pipeline — see
# de/ibikus/athena/experimental/llamaindex/. Not required by the active
# ingestion/retrieval path.
llamaindex = [
    "llama-index-core>=0.10",
    "llama-index-vector-stores-chroma",
    "llama-index-vector-stores-qdrant",
    "llama-index-embeddings-huggingface",
    "llama-index-readers-file",
]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
]

[project.scripts]
athena = "de.ibikus.athena.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
